name: Frozen external CPU reproduction 2026-10-09

on:
  push:
    branches: [codex/neuro3d-scientific-closure-20261008]
    paths:
      - .github/workflows/external-cpu-reproduction-20261009.yml
      - Docs/research/external_cpu_reproduction_profile_2026-10-09.json
      - Docs/research/external_cpu_reproduction_registration_2026-10-09.json
      - Docs/research/external_cpu_requirements_2026-10-09.txt
      - Tools/run_external_cpu_reproduction_v1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout only the required public source and evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.github/workflows/external-cpu-reproduction-20261009.yml
            /Tools/*.py
            /Blender/blender_lab/*.py
            /Blender/benchmarks/capacity_audit/*.py
            /Blender/tests/*.py
            /Blender/demo_lattice_iris/iris.csv
            /Docs/research/external_cpu_*
            /Docs/research/github_sequence_authorization_2026-10-09.json
            /Docs/research/captured_geometry_training_profile_2026-10-09.json
            /Docs/research/captured_geometry_training_registration_2026-10-09.json
            /Docs/validation/captured-scalar-ingress-2026-10-08/scene.json
            /Docs/validation/blender-lab-capture-2026-10-08/resume01/iris/capture.json
            /Docs/validation/coherent-state-graph-capture-2026-10-09/attempt01/result.json
            /Docs/validation/captured-geometry-training-2026-10-09/attempt01/worker/result.json
      - name: Set up the fixed Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
          architecture: x64
      - name: Verify published source bytes and human GitHub receipt before execution
        run: python -X utf8 Tools/run_external_cpu_reproduction_v1.py --profile Docs/research/external_cpu_reproduction_profile_2026-10-09.json --registration Docs/research/external_cpu_reproduction_registration_2026-10-09.json --verify-only
      - name: Install exact hashed Linux wheels
        run: python -m pip install --require-hashes --only-binary=:all: -r Docs/research/external_cpu_requirements_2026-10-09.txt
      - name: Execute bounded CPU controls, rational replay and geometry training
        run: python -X utf8 Tools/run_external_cpu_reproduction_v1.py --profile Docs/research/external_cpu_reproduction_profile_2026-10-09.json --registration Docs/research/external_cpu_reproduction_registration_2026-10-09.json --out reproduction-evidence
      - name: Preserve all outcomes and errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-cpu-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reproduction-evidence
          if-no-files-found: warn
          retention-days: 10
